    <!-- M-11 Tab -->
    <main id="panel-m11" class="max-w-7xl mx-auto px-6 hidden">
        <div class="glass rounded-2xl p-4 mb-6">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="relative w-full sm:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500"></i>
                    <input type="text" id="search-m11" onkeyup="filterM11Docs()" placeholder="Пошук за номером, датою, підставою..."
                        class="w-full bg-slate-900/80 text-sm text-slate-200 pl-10 pr-4 py-2.5 rounded-xl border border-slate-700/60 focus:outline-none focus:border-blue-500 transition">
                </div>
                <div class="flex items-center gap-4 text-xs text-slate-400">
                    <div>Всього: <span id="total-m11-count" class="font-bold text-slate-200">0</span></div>
                    <div>Проблемні: <span id="problem-m11-count" class="font-bold text-rose-400">0</span></div>
                    <div>Показано: <span id="visible-m11-count" class="font-bold text-slate-200">0</span></div>
                </div>
            </div>
        </div>

        <details class="glass rounded-2xl mb-6 doc-legend" open>
            <summary class="px-4 py-3 flex items-center gap-2 cursor-pointer select-none text-xs text-slate-400 hover:text-slate-200 transition">
                <i class="fa-solid fa-circle-info text-sky-400"></i>
                <span class="font-semibold">Підказка: що означають позначки в таблиці</span>
                <i class="fa-solid fa-chevron-down doc-legend-arrow ml-auto text-[10px] transition-transform"></i>
            </summary>
            <div id="m11-legend-body" class="px-4 pb-4 pt-1 text-xs border-t border-slate-800/60 divide-y divide-slate-800/40"></div>
        </details>

        <div class="glass rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse card-table">
                    <thead>
                        <tr class="bg-slate-900/90 border-b border-slate-800 text-slate-400 text-xs font-semibold uppercase">
                            <th class="py-3 px-3 w-14"></th>
                            <th class="py-3 px-3">№ М-11</th>
                            <th class="py-3 px-3">Дата</th>
                            <th class="py-3 px-3">Підстава/Кому</th>
                            <th class="py-3 px-3">Позицій</th>
                            <th class="py-3 px-3">Статус</th>
                            <th class="py-3 px-3">Збіг</th>
                            <th class="py-3 px-3">Пов'язана ВИМОГА</th>
                            <th class="py-3 px-3 text-right">Дії</th>
                        </tr>
                    </thead>
                    <tbody id="m11-tbody" class="divide-y divide-slate-800/60 text-sm">
                        <tr>
                            <td colspan="9" class="py-12 text-center text-slate-500">
                                <i class="fa-solid fa-file-invoice text-3xl mb-3 text-slate-600 block"></i>
                                <p>Документів М-11 немає.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- M-11 Manual Bind Modal -->
    <div id="m11-bind-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-2xl max-h-[90vh] rounded-2xl flex flex-col border border-slate-700 shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-sky-500/10 text-sky-400 flex items-center justify-center border border-sky-500/20">
                        <i class="fa-solid fa-link"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base text-slate-100">Прив'язати ВИМОГУ до М-11</h3>
                        <p id="m11-bind-subtitle" class="text-xs text-slate-400">Виберіть відповідну класичну вимогу для М-11</p>
                    </div>
                </div>
                <button type="button" onclick="closeBindModal()" class="text-slate-400 hover:text-white p-1.5 rounded-lg transition" title="Закрити">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Search and Filter in Modal -->
            <div class="p-4 border-b border-slate-800 bg-slate-900/50">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                    <input type="text" id="m11-bind-search" onkeyup="filterAvailableVimogas()" placeholder="Пошук за номером або датою..."
                        class="w-full bg-slate-900 text-sm text-slate-200 pl-10 pr-4 py-2 rounded-xl border border-slate-700 focus:outline-none focus:border-sky-500 transition">
                </div>
            </div>

            <!-- List of available vimogas -->
            <div id="m11-bind-list" class="flex-1 overflow-y-auto p-4 space-y-2 text-sm divide-y divide-slate-800/40 min-h-[250px] max-h-[450px]">
                <!-- Dynamically populated -->
            </div>

            <div class="px-6 py-3 border-t border-slate-800 flex items-center justify-end bg-slate-900/40">
                <button type="button" onclick="closeBindModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-xl transition">
                    Скасувати
                </button>
            </div>
        </div>
    </div>
